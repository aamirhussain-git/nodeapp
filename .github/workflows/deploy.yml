name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/nodeapp-app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/nodeapp-app:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: 3.109.207.165
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop devops-app || true
          docker rm devops-app || true
          docker run -d -v /home/ubuntu/nodeapp-logs:/app/logs -p 3000:3000 --name devops-app ${{ secrets.DOCKER_USERNAME }}/nodeapp-app:latest

